name: Jekyll Pages and repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run all checked-in unit and regression tests
        run: npm test
      - name: Check syntax, configuration, and release metadata
        run: npm run check
      - name: Parse YAML configuration
        run: |
          ruby -ryaml -e 'ARGV.each { |f| YAML.load_file(f, aliases: true); puts "YAML OK #{f}" }' .github/workflows/*.yml .github/dependabot.yml docs/_config.yml
      - name: Verify repository security settings without changing them
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          reporting=$(gh api "repos/$GITHUB_REPOSITORY/private-vulnerability-reporting" --jq '.enabled')
          echo "Private vulnerability reporting enabled: $reporting"
          test "$reporting" = true
          if gh api --silent "repos/$GITHUB_REPOSITORY/vulnerability-alerts"; then
            echo 'Dependabot alerts enabled: true'
          else
            echo '::notice::Dependabot alert status is unverified: this check requires administration read access. No repository settings were changed.'
          fi

  application-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build application in a fresh container
        run: docker build --pull --no-cache --tag "webbbs:$GITHUB_SHA" .
      - name: Audit resolved runtime dependencies
        id: audit
        continue-on-error: true
        run: docker run --rm --entrypoint npm "webbbs:$GITHUB_SHA" audit --omit=dev --audit-level=low
      - name: Record dependency audit outcome
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          echo "Dependency audit outcome: $AUDIT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUDIT_OUTCOME" != success ]; then
            echo '::warning::Dependency audit did not pass. Review the audit log; findings are not automatically fixed.'
          fi

  build:
    needs: validate
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./docs
          destination: ./_site
      - name: Validate generated site
        run: npm run pages:verify
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, application-build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Publish versioned source release without moving existing tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo '::error::Tag already exists without a release. Review it manually; it will not be moved.'
            exit 1
          fi
          tail -n +6 docs/release-notes.md > "$RUNNER_TEMP/release-notes.md"
          printf '\nCommit: `%s`\nValidation: https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "webBBS $version" --notes-file "$RUNNER_TEMP/release-notes.md"
